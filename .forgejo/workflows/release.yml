---
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# A tag vX.Y.Z (the version in appinfo/info.xml) becomes a release: the app as
# talk_stickers-X.Y.Z.tar.gz on the Forgejo release, with the version's section of
# CHANGELOG.md as its text, signed with the app's key, and published on the
# Nextcloud app store, which hands this download to the servers that install it
# (the shared action nextcloud-app-release of dawid/ci-actions). A tag without its
# section in CHANGELOG.md (## X.Y.Z - YYYY-MM-DD) fails before anything is released.
#
# Secrets: NC_APP_SIGNING_KEY, the private key of the app store certificate for
# talk_stickers (PEM); NC_APPSTORE_TOKEN, the API token of the store account
# (apps.nextcloud.com, account, API token). Without them the release still gets
# the archive, unsigned and not published. Variable: NC_APPSTORE, false keeps the
# release off the app store although NC_APPSTORE_TOKEN is set.
#
# Run by hand to retry a tag's release (the release and its text are kept, the files replaced):
# from main, with the tag in "tag" (fj actions dispatch release.yml main -I tag=v1.2.3). A tag
# made before this trigger existed cannot be picked as the run's ref: Forgejo reads the
# workflow from that ref, which has no workflow_dispatch.
name: Release
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z); empty for the tag chosen above
        type: string
        required: false

jobs:
  release:
    runs-on: docker
    container: docker.io/library/debian:bookworm-slim
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: case "$TAG" in v[0-9]*) ;; *) echo "$TAG is not a release tag"; exit 1 ;; esac

      - name: Install the tools
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends ca-certificates git openssl python3 >/dev/null

      - name: Check out
        run: |
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout -q "$TAG"

      # The app folder alone, named as the app, with the licences.
      - name: Release
        uses: https://git.ciepiela.org/dawid/ci-actions/nextcloud-app-release@main
        with:
          app-id: talk_stickers
          include: LICENSE NOTICE.md
          tag: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          signing-key: ${{ secrets.NC_APP_SIGNING_KEY }}
          # Published only when the app store's token is set and the variable NC_APPSTORE is not
          # false (a secret cannot be empty, so the variable turns a shared token off here).
          app-store: ${{ vars.NC_APPSTORE != 'false' && secrets.NC_APPSTORE_TOKEN != '' }}
          app-store-token: ${{ secrets.NC_APPSTORE_TOKEN }}
